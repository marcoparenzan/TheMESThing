# Machine telemetry: typed readings with physical quantities. Fragment of mes.contract.yaml.

scalars:
  EventTimestamp:
    base: datetime
  IoTMessageId:
    base: string
    minLength: 1
    maxLength: 100

  PieceCount:
    base: double
    min: 0
  ReferencePeriodType:
    base: string
    minLength: 1
    maxLength: 50

types:
  MachineTemperatureReading:
    kind: dto
    attributes:
      machineId: MachineId
      value: TemperatureMeasure
      recordedAt: EventTimestamp
  MachineLineSpeedReading:
    kind: dto
    attributes:
      machineId: MachineId
      value: LineSpeedMeasure
      recordedAt: EventTimestamp
  MachineVibrationReading:
    kind: dto
    attributes:
      machineId: MachineId
      value: VibrationMeasure
      recordedAt: EventTimestamp
  MachineCycleTimeReading:
    kind: dto
    attributes:
      machineId: MachineId
      value: CycleTimeMeasure
      recordedAt: EventTimestamp
  MachineProductionCounters:
    kind: dto
    attributes:
      machineId: MachineId
      periodType: ReferencePeriodType
      periodEnd: EventTimestamp
      plannedProductionTime: DurationMeasure
      operatingTime: DurationMeasure
      runTime: DurationMeasure
      plannedQuantity: PieceCount
      totalQuantity: PieceCount
      goodQuantity: PieceCount
  MachineStatusReport:
    kind: dto
    attributes:
      machineId: MachineId
      status: MachineStatus
      reportedAt: EventTimestamp
