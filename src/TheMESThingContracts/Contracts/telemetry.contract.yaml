context: MachineTelemetry
namespace: TheMESThing.Contracts

includes:
  - measures.yaml

scalars:
  MachineId:
    base: guid
  ProductionOrderId:
    base: guid
  EventTimestamp:
    base: datetime
  IoTMessageId:
    base: string
    minLength: 1
    maxLength: 100

types:
  MachineTemperatureReading:
    kind: dto
    attributes:
      machineId: MachineId
      value: TemperatureMeasure
      recordedAt: EventTimestamp
  MachineLineSpeedReading:
    kind: dto
    attributes:
      machineId: MachineId
      value: LineSpeedMeasure
      recordedAt: EventTimestamp
  MachineVibrationReading:
    kind: dto
    attributes:
      machineId: MachineId
      value: VibrationMeasure
      recordedAt: EventTimestamp
  MachineCycleTimeReading:
    kind: dto
    attributes:
      machineId: MachineId
      value: CycleTimeMeasure
      recordedAt: EventTimestamp
